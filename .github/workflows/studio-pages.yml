name: Publish Envoy demo and case study

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'release/envoybench-v0.1/**'
      - 'release/qasper-agent-study/**'
      - 'release/hackathon-research-mcp/**'
      - 'scripts/case_study/reproduce_case_study.py'
      - 'scripts/mcp/build_demo.py'
      - '.github/workflows/studio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify the frozen comparison before publishing
        run: python -I -S scripts/case_study/reproduce_case_study.py
      - name: Verify the QASPER extension
        working-directory: release/qasper-agent-study
        run: sha256sum --check SHA256SUMS
      - uses: actions/configure-pages@v5
      - name: Build the read-only product walkthrough and saved case study
        run: |
          python -I -S scripts/mcp/build_demo.py --output _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy public walkthrough
        id: deployment
        uses: actions/deploy-pages@v4
